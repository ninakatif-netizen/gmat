  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    globalThis.openai = {
      ...globalThis.openai,

    postToHost(&quot;height&quot;, {

          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              /** @type {unknown} */

                return;

      return;
    }

        [&#x27;Data Insights&#x27;,&#x27;Data Sufficiency&#x27;],[&#x27;Data Insights&#x27;,&#x27;Table Analysis&#x27;],[&#x27;Data Insights&#x27;,&#x27;Graphics Interpretation&#x27;],[&#x27;Data Insights&#x27;,&#x27;Multi-Source Reasoning&#x27;],[&#x27;Data Insights&#x27;,&#x27;Two-Part Analysis&#x27;],
        [&#x27;Test execution&#x27;,&#x27;Pacing &amp; guessing&#x27;],[&#x27;Test execution&#x27;,&#x27;Review, order &amp; stamina&#x27;]
      ];
      const realStatus = {
        &#x27;Percents &amp; successive changes&#x27;:&#x27;developing&#x27;,&#x27;Ratios &amp; proportions&#x27;:&#x27;developing&#x27;,&#x27;Fractions &amp; decimals&#x27;:&#x27;developing&#x27;,
        &#x27;Divisibility &amp; remainders&#x27;:&#x27;introduced&#x27;,&#x27;Linear equations&#x27;:&#x27;introduced&#x27;,&#x27;Rates, speed &amp; work&#x27;:&#x27;introduced&#x27;,
        &#x27;Sequences&#x27;:&#x27;developing&#x27;,&#x27;CR: Weaken&#x27;:&#x27;introduced&#x27;,&#x27;CR: Strengthen&#x27;:&#x27;introduced&#x27;,&#x27;CR: Assumption&#x27;:&#x27;introduced&#x27;,&#x27;Data Sufficiency&#x27;:&#x27;developing&#x27;
      };
      const realDetails = {
        &#x27;Percents &amp; successive changes&#x27;:[&#x27;October 25: 16 of 21 scored correct after early corrections&#x27;,&#x27;Delayed mixed recheck, then medium-hard wording&#x27;],
        &#x27;Ratios &amp; proportions&#x27;:[&#x27;October 25: 16 of 19 scored correct; changing-ratio work also included guidance&#x27;,&#x27;Retry applied ratio changes independently&#x27;],
        &#x27;Fractions &amp; decimals&#x27;:[&#x27;October 25: 7 of 8 scored correct&#x27;,&#x27;Mix fractions into disguised word problems&#x27;],
        &#x27;Divisibility &amp; remainders&#x27;:[&#x27;Q001 pending&#x27;,&#x27;Explain your first attempt&#x27;],
        &#x27;Linear equations&#x27;:[&#x27;Simple word-problem setup correct; mixed setup still developing&#x27;,&#x27;Continue with medium bilingual questions&#x27;],
        &#x27;Rates, speed &amp; work&#x27;:[&#x27;One official rates/distance question correct&#x27;,&#x27;Practise a medium question under time&#x27;],
        &#x27;Sequences&#x27;:[&#x27;Q003 guided · Q004 independently correct&#x27;,&#x27;Next: official medium sequence or pattern question&#x27;],
        &#x27;CR: Weaken&#x27;:[&#x27;1 of 1 correct · easy set&#x27;,&#x27;Calibrate with hard official-style logic&#x27;],
        &#x27;CR: Strengthen&#x27;:[&#x27;3 of 3 correct · easy set&#x27;,&#x27;Not mastered; complete hard calibration&#x27;],

        &#x27;Data Sufficiency&#x27;:[&#x27;2 of 2 scored correct · Q003 guided correct&#x27;,&#x27;Next: official medium question without hints&#x27;]
      };
      const demoStatus = {
        &#x27;Divisibility &amp; remainders&#x27;:&#x27;developing&#x27;,&#x27;Percents &amp; successive changes&#x27;:&#x27;mastered&#x27;,&#x27;Ratios &amp; proportions&#x27;:&#x27;developing&#x27;,&#x27;Linear equations&#x27;:&#x27;developing&#x27;,&#x27;Rates, speed &amp; work&#x27;:&#x27;introduced&#x27;,&#x27;Mixtures &amp; weighted averages&#x27;:&#x27;developing&#x27;,

        &#x27;Data Sufficiency&#x27;:&#x27;developing&#x27;,&#x27;Table Analysis&#x27;:&#x27;introduced&#x27;,&#x27;Graphics Interpretation&#x27;:&#x27;introduced&#x27;,&#x27;Pacing &amp; guessing&#x27;:&#x27;introduced&#x27;
      };
      const labels = {&#x27;mastered&#x27;:&#x27;Mastered&#x27;,&#x27;developing&#x27;:&#x27;Developing&#x27;,&#x27;introduced&#x27;:&#x27;Introduced&#x27;,&#x27;not-started&#x27;:&#x27;Not started&#x27;};
      let mode = &#x27;real&#x27;;
      let selected = &#x27;Divisibility &amp; remainders&#x27;;

      function topicStatus(name) {
        if (mode === &#x27;real&#x27;) return realStatus[name] || &#x27;not-started&#x27;;
        return demoStatus[name] || &#x27;not-started&#x27;;
      }

      function details(name, status) {
        if (mode === &#x27;real&#x27; &amp;&amp; realDetails[name]) return realDetails[name];
        if (mode === &#x27;real&#x27;) return [&#x27;No questions yet&#x27;,&#x27;Add to the diagnostic rotation&#x27;];
        const demo = {
          &#x27;mastered&#x27;:[&#x27;4 attempts · 100% recent accuracy&#x27;,&#x27;Recheck next week&#x27;],
          &#x27;developing&#x27;:[&#x27;3 attempts · 67% accuracy&#x27;,&#x27;Complete a targeted 3-question set&#x27;],
          &#x27;introduced&#x27;:[&#x27;1 attempt recorded&#x27;,&#x27;Practice two more questions&#x27;],
          &#x27;not-started&#x27;:[&#x27;No questions yet&#x27;,&#x27;Add to the diagnostic rotation&#x27;]
        };
        return demo[status];
      }

      function renderTopics() {
        const filter = root.querySelector(&#x27;#section-filter&#x27;).value;
        const grid = root.querySelector(&#x27;#topic-grid&#x27;);
        grid.innerHTML = &#x27;&#x27;;
        topics.filter(([section]) =&gt; filter === &#x27;all&#x27; || section === filter).forEach(([section,name]) =&gt; {
          const status = topicStatus(name);
          const btn = document.createElement(&#x27;button&#x27;);
          btn.type = &#x27;button&#x27;;
          btn.className = &#x27;btn viz-tile topic-tile cursor-interaction&#x27;;
          btn.dataset.status = status;
          btn.setAttribute(&#x27;aria-pressed&#x27;, name === selected ? &#x27;true&#x27; : &#x27;false&#x27;);
          btn.setAttribute(&#x27;aria-label&#x27;, `${name}, ${labels[status]}, ${section}`);
          const nameEl = document.createElement(&#x27;span&#x27;);
          nameEl.className = &#x27;topic-name&#x27;;
          nameEl.textContent = name;
          const stateEl = document.createElement(&#x27;span&#x27;);
          stateEl.className = &#x27;topic-state text-small&#x27;;
          stateEl.textContent = `${section} · ${labels[status]}`;
          btn.append(nameEl,stateEl);
          btn.addEventListener(&#x27;click&#x27;, () =&gt; { selected = name; renderTopics(); renderDetail(); save(); });
          grid.appendChild(btn);
        });
        if (!topics.some(([section,name]) =&gt; (filter === &#x27;all&#x27; || section === filter) &amp;&amp; name === selected)) {
          const first = topics.find(([section]) =&gt; filter === &#x27;all&#x27; || section === filter);
          if (first) selected = first[1];
          [...grid.children].forEach((el,i) =&gt; el.setAttribute(&#x27;aria-pressed&#x27;, i === 0 ? &#x27;true&#x27; : &#x27;false&#x27;));
        }
      }

      function renderDetail() {
